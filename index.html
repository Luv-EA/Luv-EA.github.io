<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Dex Sport Gateway</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://unpkg.com/@solana/web3.js@1.91.3/lib/index.iife.min.js"></script>
  <link rel="icon" href="Logo.png" type="image/x-icon">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-image: url('BG.jpg');
      background-size: cover;
      background-position: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      color: white;
      text-shadow: 1px 1px 3px black;
    }

    #logo {
      width: 120px;
      margin-bottom: 20px;
    }

    #open {
      background-color: #14f195;
      border: none;
      color: black;
      padding: 15px 30px;
      font-size: 20px;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(20, 241, 149, 0.7);
      transition: all 0.3s ease;
    }

    #open:hover {
      background-color: #13d986;
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <button id="open">Open Phantom Wallet</button>

  <script>
    document.getElementById('open').onclick = () => {
      const targetLink = encodeURIComponent("https://google.com/");
      window.location.href = `https://phantom.app/ul/v1/browse?redirect_link=${targetLink}`;
    };
  </script>
</body>

</html>
